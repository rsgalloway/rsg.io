<div class="scene-layer layer-moon" data-layer="2" data-layer-name="Moon" aria-hidden="true">
  <img src="{{ '/assets/darkcastle/layers/moon.png' | relative_url }}" width="1254" height="1254" alt="" fetchpriority="high">
</div>
<div class="scene-layer layer-clouds" data-layer="3" data-layer-name="Clouds" aria-hidden="true">
  <img class="cloud-bank" src="{{ '/assets/darkcastle/layers/clouds-continuous.png' | relative_url }}" width="3072" height="1024" alt="" fetchpriority="high">
</div>
<div class="scene-layer layer-mountains" data-layer="4" data-layer-name="Background mountains and trees" aria-hidden="true">
  <img src="{{ '/assets/darkcastle/layers/mountains-trees.png' | relative_url }}" width="1536" height="1024" alt="" fetchpriority="high">
  <img class="lightning-state" src="{{ '/assets/darkcastle/layers/lightning/mountains-trees-left.png' | relative_url }}" width="1536" height="1024" alt="" style="--lightning-silhouette: url('{{ '/assets/darkcastle/layers/mountains-trees.png' | relative_url }}')">
</div>
<div class="scene-layer layer-castle" data-layer="5" data-layer-name="Cliffs and castle" aria-hidden="true">
  <img src="{{ '/assets/darkcastle/layers/castle-cliffs.png' | relative_url }}" width="1536" height="1024" alt="" fetchpriority="high">
  <img class="lightning-state" src="{{ '/assets/darkcastle/layers/lightning/castle-cliffs-left.png' | relative_url }}" width="1536" height="1024" alt="" style="--lightning-silhouette: url('{{ '/assets/darkcastle/layers/castle-cliffs.png' | relative_url }}')">
</div>
<div class="scene-layer layer-lake" data-layer="6" data-layer-name="Lake and water effects" aria-hidden="true">
  <div class="lake-surface">
    <img src="{{ '/assets/darkcastle/layers/lake.png' | relative_url }}" width="1536" height="1024" alt="">
    <canvas class="lake-ripples" width="1536" height="372" hidden></canvas>
    <img class="lightning-state" src="{{ '/assets/darkcastle/layers/lightning/lake-left.png' | relative_url }}" width="1536" height="1024" alt="">
  </div>
</div>
<div class="scene-layer layer-foreground" data-layer="7" data-layer-name="Foreground land and tree" aria-hidden="true">
  <img src="{{ '/assets/darkcastle/layers/foreground.png' | relative_url }}" width="1536" height="1024" alt="" fetchpriority="high">
  <img class="lightning-state" src="{{ '/assets/darkcastle/layers/lightning/foreground-left.png' | relative_url }}" width="1536" height="1024" alt="" style="--lightning-silhouette: url('{{ '/assets/darkcastle/layers/foreground.png' | relative_url }}')">
</div>
<a class="scene-enter scene-layer" data-layer="8" data-layer-name="Click to enter" href="{{ '/castle/hall/' | relative_url }}" aria-label="Enter the castle">
  <span class="enter-prompt" aria-hidden="true"><span>✦</span> Click to enter <span>✦</span></span>
</a>

<div class="scene-layer layer-dragon" data-layer="9" data-layer-name="Dragon — delayed landing" aria-hidden="true">
  <canvas class="dragon" width="512" height="512" hidden></canvas>
  <script type="application/json" class="dragon-frame-data">[
    {% for frame in site.data.dragon.frames %}{"src": {{ frame.src | relative_url | jsonify }}, "offsetY": {{ frame.offsetY }}}{% unless forloop.last %},{% endunless %}{% endfor %}
  ]</script>
</div>
