{% assign social_scene = site.data.castle.exterior %}
{% assign social_title = page.title | default: site.title %}
{% assign social_description = page.description | default: site.description %}
{% assign canonical_url = page.url | replace: 'index.html', '' | absolute_url %}
<link rel="canonical" href="{{ canonical_url | escape }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ site.title | escape }}">
<meta property="og:title" content="{{ social_title | escape }}">
<meta property="og:description" content="{{ social_description | escape }}">
<meta property="og:url" content="{{ canonical_url | escape }}">
<meta property="og:image" content="{{ social_scene.image | absolute_url | escape }}">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="{{ social_scene.width }}">
<meta property="og:image:height" content="{{ social_scene.height }}">
<meta property="og:image:alt" content="{{ social_scene.description | escape }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ social_title | escape }}">
<meta name="twitter:description" content="{{ social_description | escape }}">
<meta name="twitter:image" content="{{ social_scene.image | absolute_url | escape }}">
<meta name="twitter:image:alt" content="{{ social_scene.description | escape }}">
